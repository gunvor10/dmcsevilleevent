  <section id="enquiry" style="max-width:860px;margin:0 auto;padding:0 32px 90px;">
    <div style="background:#f6f4f0;border-radius:6px;padding:44px 40px;">

        <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:#0d3d40;">Company<input type="text" name="company" maxlength="120" autocomplete="organization" style="font:inherit;font-weight:400;padding:12px 14px;border:1px solid #cfdcdd;border-radius:2px;background:#ffffff;"></label>
        <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:#0d3d40;">E-mail *<input type="email" name="email" required maxlength="120" autocomplete="email" style="font:inherit;font-weight:400;padding:12px 14px;border:1px solid #cfdcdd;border-radius:2px;background:#ffffff;"></label>
        <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:#0d3d40;">Phone / WhatsApp<input type="tel" name="phone" maxlength="40" autocomplete="tel" style="font:inherit;font-weight:400;padding:12px 14px;border:1px solid #cfdcdd;border-radius:2px;background:#ffffff;"></label>
        <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:#0d3d40;">Type of event *<select name="type" required style="font:inherit;font-weight:400;padding:12px 14px;border:1px solid #cfdcdd;border-radius:2px;background:#ffffff;"><option value="">Please choose</option><option>Incentive trip</option><option>Meeting or conference</option><option>Team building</option><option>Gala dinner or event</option><option>Group travel</option><option>Tailor-made trip</option><option>Other</option></select></label>
        <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:#0d3d40;">Number of guests *<input type="number" name="guests" required min="1" max="5000" style="font:inherit;font-weight:400;padding:12px 14px;border:1px solid #cfdcdd;border-radius:2px;background:#ffffff;"></label>
        <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:#0d3d40;">Dates or month<input type="text" name="dates" maxlength="80" placeholder="e.g. 14–17 May 2027" style="font:inherit;font-weight:400;padding:12px 14px;border:1px solid #cfdcdd;border-radius:2px;background:#ffffff;"></label>
        <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:#0d3d40;">Activity of interest<input type="text" name="activity" maxlength="120" style="font:inherit;font-weight:400;padding:12px 14px;border:1px solid #cfdcdd;border-radius:2px;background:#ffffff;"></label>
        <label style="grid-column:1/-1;display:flex;flex-direction:column;gap:6px;font-weight:600;color:#0d3d40;">Your message *<textarea name="message" required rows="6" maxlength="4000" style="font:inherit;font-weight:400;padding:12px 14px;border:1px solid #cfdcdd;border-radius:2px;background:#ffffff;resize:vertical;"></textarea></label>

      </form>
    </div>
